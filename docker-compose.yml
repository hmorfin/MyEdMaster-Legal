services:

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["app"]

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
    profiles: ["app", "dev", "prod"]

  celery:
    build: ./backend
    command: celery -A config worker --loglevel=info
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["app"]

  ai:
    build: ./ai
    ports:
      - "8001:8001"
    env_file:
      - ./ai/.env
    volumes:
      - ai_model_cache:/root/.cache
      - ./ai/logs:/app/logs
    profiles: ["app", "dev", "prod"]

  frontend:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./client:/app
      - /app/node_modules
    profiles: ["app", "dev", "prod"]

volumes:
  mongo_data:
  ai_model_cache:
